name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Stamp the release version into Info.plist
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" Info.plist

      - name: Build the DMG
        run: ./release.sh

      - name: Attach the DMG to the release
        run: gh release upload "$TAG" "dist/Awake-$VERSION.dmg" --clobber

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          SHA256=$(shasum -a 256 "dist/Awake-$VERSION.dmg" | cut -d' ' -f1)
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:betterCallHex/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/awake.rb
          git diff --exit-code --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "awake $VERSION"
          git push

      - name: Open a PR with the release's sizes in the README
        run: |
          eval "$(scripts/measure.sh --sizes "dist/Awake-$VERSION.dmg")"
          BRANCH="docs/release-$VERSION-size"
          git checkout -- Info.plist
          git fetch --depth 1 origin main
          git switch -c "$BRANCH" FETCH_HEAD
          python3 scripts/update-readme-sizes.py "$VERSION" "$download_bytes" "$app_bytes" "$app_files"
          git diff --exit-code --quiet README.md && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: match the README sizes to the Awake $VERSION release" README.md
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: match the README sizes to the Awake $VERSION release" \
            --body "Download and size-on-disk numbers measured from \`Awake-$VERSION.dmg\` by \`scripts/measure.sh --sizes\`. Memory and CPU stay as measured by hand: run \`scripts/measure.sh\` on a Mac to refresh them."
